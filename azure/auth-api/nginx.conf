# CORS för browser-klienter (Supabase JS skickar credentials — * fungerar inte)
map $http_origin $cors_origin {
    default "";
    "https://www.testimony.se"  "https://www.testimony.se";
    "https://testimony.se"      "https://testimony.se";
    "http://localhost:3005"     "http://localhost:3005";
}

server {
    listen 8080;
    server_name _;

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /auth/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, x-client-info, X-Client-Info, x-supabase-api-version, X-Supabase-Api-Version, Accept, Prefer" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Expose-Headers "X-Total-Count, Link, X-Supabase-Api-Version" always;

        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host ca-testimony-gotrue.livelyflower-b897116b.swedencentral.azurecontainerapps.io;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass https://ca-testimony-gotrue.livelyflower-b897116b.swedencentral.azurecontainerapps.io/;
    }

    location /rest/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, x-client-info, X-Client-Info, x-supabase-api-version, X-Supabase-Api-Version, Accept, Accept-Profile, Content-Profile, Prefer, Range" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Expose-Headers "Content-Range, X-Total-Count" always;

        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host ca-testimony-postgrest.livelyflower-b897116b.swedencentral.azurecontainerapps.io;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass https://ca-testimony-postgrest.livelyflower-b897116b.swedencentral.azurecontainerapps.io/;
    }

    location / {
        return 200 'testimony API gateway';
        add_header Content-Type text/plain;
    }
}
